<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>TAJAMAL — Cosmic Neural Universe</title>

<style>
*{

}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;

}

canvas{

    inset:0;

#camera{

.brand{

    background:rgba(0,0,0,.62);

    backdrop-filter:blur(16px);

    cursor:pointer;

}

}

#signature{

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="hud">

    <div class="brand">
        TAJAMAL
    </div>

    <div class="signature">

    </div>

    <div
        class="environment"
        id="environment">

    </div>

</div>

<div id="signature">

</div>

<div id="bottom">

    <div id="gesture">
        MOUSE / TOUCH READY
    </div>

    <div id="hint">
        OPEN PALM • FIST • PINCH • TWO HANDS • SWIPE • SPACE
    </div>

</div>

<button id="start">
    ENTER TAJAMAL UNIVERSE
</button>

<div id="loading"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>


<script>

/* ============================================================
   TAJAMAL COSMIC NEURAL ENGINE
   ============================================================ */

const PARTICLES = 160000;


/* ============================================================
   RENDERER
   ============================================================ */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:
            "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setClearColor(
    0x000000,
    1
);

document.body.appendChild(
    renderer.domElement
);


/* ============================================================
   SCENE
   ============================================================ */

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        55,
        innerWidth/
        innerHeight,
        .05,
        250
    );

camera.position.z=10;


/* ============================================================
   UNIVERSE MODES
   ============================================================ */

const universes=[

    "MILKY WAY",

    "NEBULA",

    "BLACK HOLE",

    "SATURN SYSTEM",

    "WORMHOLE",

    "SUPERNOVA",

    "GALAXY COLLISION",

    "COSMIC VORTEX",

    "TAJAMAL HEART",

    "TAJAMAL FLOWER",

    "DNA UNIVERSE",

    "FIREWORK UNIVERSE",

    "COSMIC SPHERE",

    "QUASAR",

    "STAR STORM"

];

let universe=0;


/* ============================================================
   HAND STATE
   ============================================================ */

let handDetected=false;

let targetHandX=0;
let targetHandY=0;

let handX=0;
let handY=0;

let openness=.4;
let pinch=0;

let power=.2;

let velocity=0;

let previousX=.5;
let previousY=.5;

let previousTime=
    performance.now();

let swipeLock=0;


/* ============================================================
   PARTICLES
   ============================================================ */

const positions=
    new Float32Array(
        PARTICLES*3
    );

const seeds=
    new Float32Array(
        PARTICLES
    );

const randoms=
    new Float32Array(
        PARTICLES
    );

const sizes=
    new Float32Array(
        PARTICLES
    );


for(
    let i=0;
    i<PARTICLES;
    i++
){

    const p=i*3;

    positions[p]=
        (Math.random()-.5)*2;

    positions[p+1]=
        (Math.random()-.5)*2;

    positions[p+2]=
        (Math.random()-.5)*2;

    seeds[i]=
        Math.random()*10000;

    randoms[i]=
        Math.random();

    sizes[i]=
        .3+
        Math.random()*1.8;
}


const geometry=
    new THREE.BufferGeometry();


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

geometry.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(
        seeds,
        1
    )
);

geometry.setAttribute(
    "aRandom",
    new THREE.BufferAttribute(
        randoms,
        1
    )
);

geometry.setAttribute(
    "aSize",
    new THREE.BufferAttribute(
        sizes,
        1
    )
);


/* ============================================================
   COSMIC VERTEX SHADER
   ============================================================ */

const vertexShader = `

uniform float uTime;
uniform float uMode;
uniform float uExpansion;
uniform float uGravity;
uniform float uShock;
uniform float uPower;

uniform vec3 uHand;

attribute float aSeed;
attribute float aRandom;
attribute float aSize;

varying float vEnergy;
varying float vRandom;

#define PI 3.14159265359


/* ==========================================================
   MILKY WAY
========================================================== */

vec3 milkyWay(
    float a,
    float r,
    float s
){

    float radius=
        .15+
        r*5.2;

    float arms=5.0;

    float angle=
        a+
        radius*1.75+
        sin(a*arms)*.13;

    float thickness=
        (s-.5)*.75;

    return vec3(

        cos(angle)*radius,

        thickness+
        sin(a*4.0+s*8.0)*.16,

        sin(angle)*radius

    );
}


/* ==========================================================
   NEBULA
========================================================== */

vec3 nebula(
    float a,
    float r,
    float s
){

    float radius=
        r*5.5;

    float cloud=
        sin(a*4.0+s*4.0)+
        sin(a*8.0+s*7.0)+
        sin(a*13.0+s*2.0);

    radius+=cloud*.28;

    return vec3(

        cos(a)*radius,

        sin(a*1.7+s)*radius*.6,

        sin(a)*radius

    );
}


/* ==========================================================
   BLACK HOLE
========================================================== */

vec3 blackHole(
    float a,
    float r,
    float s
){

    float radius=
        .45+
        r*4.8;

    float angle=
        a+
        radius*3.5+
        uTime*.9;

    vec3 p=vec3(

        cos(angle)*radius,

        (s-.5)*.16,

        sin(angle)*radius

    );

    float bend=
        1.0/
        (radius+.3);

    p.y+=
        sin(angle*3.0)*
        bend;

    return p;
}


/* ==========================================================
   SATURN
========================================================== */

vec3 saturn(
    float a,
    float r,
    float s
){

    if(r<.38){

        float z=
            1.0-
            2.0*r;

        float rr=
            sqrt(
                max(
                    0.0,
                    1.0-z*z
                )
            );

        return vec3(

            rr*cos(a),

            z,

            rr*sin(a)

        )*1.5;

    }

    float ring=
        1.9+
        r*2.2;

    return vec3(

        cos(a)*ring,

        (s-.5)*.08,

        sin(a)*ring

    );
}


/* ==========================================================
   WORMHOLE
========================================================== */

vec3 wormhole(
    float a,
    float r,
    float s
){

    float z=
        (r-.5)*8.0;

    float radius=
        .25+
        abs(z)*.35;

    float angle=
        a+
        z*2.5+
        uTime;

    return vec3(

        cos(angle)*radius,

        sin(angle)*radius,

        z

    );
}


/* ==========================================================
   SUPERNOVA
========================================================== */

vec3 supernova(
    float a,
    float r,
    float s
){

    float theta=
        acos(
            1.0-
            2.0*r
        );

    float phi=a;

    float radius=
        .2+
        r*5.0;

    radius*=
        1.0+
        sin(
            uTime*5.0+
            radius*3.0
        )*.08;

    return vec3(

        sin(theta)*cos(phi),

        sin(theta)*sin(phi),

        cos(theta)

    )*radius;
}


/* ==========================================================
   GALAXY COLLISION
========================================================== */

vec3 collision(
    float a,
    float r,
    float s
){

    float radius=
        .2+
        r*4.5;

    float side=
        s>.5
        ?1.0
        :-1.0;

    float angle=
        a+
        side*radius*1.5;

    vec3 p=vec3(

        cos(angle)*radius,

        sin(angle)*radius*.35,

        sin(angle)*radius

    );

    p.x+=
        side*2.1;

    return p;
}


/* ==========================================================
   VORTEX
========================================================== */

vec3 vortex(
    float a,
    float r,
    float s
){

    float radius=
        .15+
        r*4.8;

    float angle=
        a+
        radius*4.2+
        uTime*.8;

    return vec3(

        cos(angle)*radius,

        sin(angle)*radius,

        (r-.5)*5.5

    );
}


/* ==========================================================
   HEART
========================================================== */

vec3 heart(
    float a,
    float r,
    float s
){

    float t=a;

    float x=
        16.0*
        pow(
            sin(t),
            3.0
        );

    float y=
        13.0*cos(t)
        -
        5.0*cos(2.0*t)
        -
        2.0*cos(3.0*t)
        -
        cos(4.0*t);

    float z=
        (s-.5)*2.0;

    return vec3(

        x*.13,

        y*.13,

        z

    );
}


/* ==========================================================
   FLOWER
========================================================== */

vec3 flower(
    float a,
    float r,
    float s
){

    float petals=9.0;

    float radius=
        1.5+
        sin(a*petals)*.9;

    return vec3(

        cos(a)*radius,

        sin(a)*radius,

        sin(
            a*5.0+
            s*8.0
        )*.55

    );
}


/* ==========================================================
   DNA
========================================================== */

vec3 dna(
    float a,
    float r,
    float s
){

    float y=
        (r-.5)*7.0;

    float angle=
        y*3.0+
        uTime;

    return vec3(

        cos(angle)*1.5,

        y,

        sin(angle)*1.5

    );
}


/* ==========================================================
   FIREWORK
========================================================== */

vec3 firework(
    float a,
    float r,
    float s
){

    float theta=
        acos(
            1.0-
            2.0*r
        );

    float radius=
        r*4.8;

    return vec3(

        sin(theta)*cos(a),

        sin(theta)*sin(a),

        cos(theta)

    )*radius;
}


/* ==========================================================
   COSMIC SPHERE
========================================================== */

vec3 sphere(
    float a,
    float r,
    float s
){

    float z=
        1.0-
        2.0*r;

    float rr=
        sqrt(
            max(
                0.0,
                1.0-z*z
            )
        );

    return vec3(

        rr*cos(a),

        z,

        rr*sin(a)

    )*2.6;
}


/* ==========================================================
   QUASAR
========================================================== */

vec3 quasar(
    float a,
    float r,
    float s
){

    float z=
        (r-.5)*9.0;

    float radius=
        .2+
        abs(z)*.2;

    float angle=
        a+
        z*4.0+
        uTime;

    return vec3(

        cos(angle)*radius,

        z,

        sin(angle)*radius

    );
}


/* ==========================================================
   STAR STORM
========================================================== */

vec3 starStorm(
    float a,
    float r,
    float s
){

    float radius=
        r*6.0;

    float angle=
        a+
        sin(r*20.0)*
        .5;

    return vec3(

        cos(angle)*radius,

        (s-.5)*radius,

        sin(angle)*radius

    );
}


/* ==========================================================
   MAIN
========================================================== */

void main(){

    float t=
        aSeed+
        uTime*.13;

    float r=aRandom;

    vec3 p;


    if(uMode<.5)
        p=milkyWay(t,r,aSeed);

    else if(uMode<1.5)
        p=nebula(t,r,aSeed);

    else if(uMode<2.5)
        p=blackHole(t,r,aSeed);

    else if(uMode<3.5)
        p=saturn(t,r,aSeed);

    else if(uMode<4.5)
        p=wormhole(t,r,aSeed);

    else if(uMode<5.5)
        p=supernova(t,r,aSeed);

    else if(uMode<6.5)
        p=collision(t,r,aSeed);

    else if(uMode<7.5)
        p=vortex(t,r,aSeed);

    else if(uMode<8.5)
        p=heart(t,r,aSeed);

    else if(uMode<9.5)
        p=flower(t,r,aSeed);

    else if(uMode<10.5)
        p=dna(t,r,aSeed);

    else if(uMode<11.5)
        p=firework(t,r,aSeed);

    else if(uMode<12.5)
        p=sphere(t,r,aSeed);

    else if(uMode<13.5)
        p=quasar(t,r,aSeed);

    else
        p=starStorm(t,r,aSeed);


    /* cosmic turbulence */

    p.x+=
        sin(
            t*1.3+
            p.z*2.0
        )*.09;

    p.y+=
        cos(
            t*1.6+
            p.x*1.7
        )*.09;

    p.z+=
        sin(
            t*1.1+
            p.y*2.0
        )*.09;


    /* expansion */

    p*=
        1.0+
        uExpansion*1.65;


    /* hand gravity */

    vec3 delta=
        p-uHand;

    float distance=
        length(delta)+.001;

    float gravity=
        exp(
            -distance*1.05
        )*
        uGravity;

    p-=
        normalize(delta)*
        gravity;


    /* shockwave */

    float wave=
        sin(
            distance*8.0-
            uTime*11.0
        )*
        uShock;

    p+=
        normalize(delta)*
        wave;


    /* cosmic power */

    p*=
        1.0+
        uPower*.22;


    vEnergy=
        uPower+
        uShock+
        uGravity*.12;

    vRandom=
        aRandom;


    vec4 mv=
        modelViewMatrix*
        vec4(
            p,
            1.0
        );

    gl_Position=
        projectionMatrix*
        mv;


    gl_PointSize=
        aSize*
        (7.0/(-mv.z))*
        (1.0+
        vEnergy*2.0);
}
`;


/* ============================================================
   PARTICLE FRAGMENT SHADER
============================================================ */

const fragmentShader=`

uniform float uTime;
uniform float uHue;

varying float vEnergy;
varying float vRandom;

vec3 hsv2rgb(vec3 c){

    vec4 K=
        vec4(
            1.0,
            2.0/3.0,
            1.0/3.0,
            3.0
        );

    vec3 p=
        abs(
            fract(
                c.xxx+
                K.xyz
            )*
            6.0-
            K.www
        );

    return c.z*
        mix(
            K.xxx,
            clamp(
                p-K.xxx,
                0.0,
                1.0
            ),
            c.y
        );
}

void main(){

    vec2 uv=
        gl_PointCoord-
        .5;

    float d=
        length(uv);

    if(d>.5)
        discard;

    float glow=
        smoothstep(
            .5,
            0.0,
            d
        );

    float hue=
        fract(
            uHue+
            vRandom*.4+
            vEnergy*.08
        );

    vec3 color=
        hsv2rgb(
            vec3(
                hue,
                .8,
                1.0
            )
        );

    color*=
        glow*
        (
            1.0+
            vEnergy*2.5
        );

    gl_FragColor=
        vec4(
            color,
            glow
        );
}
`;


/* ============================================================
   PARTICLE MATERIAL
============================================================ */

const uniforms={

    uTime:{value:0},

    uMode:{value:0},

    uExpansion:{value:.3},

    uGravity:{value:0},

    uShock:{value:0},

    uPower:{value:.2},

    uHue:{value:.58},

    uHand:{
        value:
        new THREE.Vector3()
    }
};


const material=
    new THREE.ShaderMaterial({

        uniforms,

        vertexShader,

        fragmentShader,

        transparent:true,

        depthWrite:false,

        blending:
            THREE.AdditiveBlending
    });


const particles=
    new THREE.Points(
        geometry,
        material
    );

scene.add(particles);


/* ============================================================
   DEEP SPACE STARS
============================================================ */

const STAR_COUNT=16000;

const starData=
    new Float32Array(
        STAR_COUNT*3
    );

for(
    let i=0;
    i<STAR_COUNT;
    i++
){

    const p=i*3;

    const radius=
        25+
        Math.random()*110;

    const theta=
        Math.random()*
        Math.PI*2;

    const phi=
        Math.acos(
            2*Math.random()-1
        );

    starData[p]=
        radius*
        Math.sin(phi)*
        Math.cos(theta);

    starData[p+1]=
        radius*
        Math.sin(phi)*
        Math.sin(theta);

    starData[p+2]=
        radius*
        Math.cos(phi);
}


const starGeometry=
    new THREE.BufferGeometry();

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starData,
        3
    )
);


const starMaterial=
    new THREE.PointsMaterial({

        color:0xffffff,

        size:.035,

        transparent:true,

        opacity:.75,

        depthWrite:false
    });


const stars=
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* ============================================================
   ENERGY RINGS
============================================================ */

const rings=[];

for(
    let i=0;
    i<9;
    i++
){

    const ringGeometry=
        new THREE.RingGeometry(
            1+i*.55,
            1.006+i*.55,
            128
        );

    const ringMaterial=
        new THREE.MeshBasicMaterial({

            color:0xffffff,

            transparent:true,

            opacity:.02,

            side:
                THREE.DoubleSide,

            blending:
                THREE.AdditiveBlending,

            depthWrite:false
        });

    const ring=
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );

    ring.rotation.x=
        Math.PI/2;

    scene.add(ring);

    rings.push(ring);
}


/* ============================================================
   PLANETARY SYSTEM
============================================================ */

const planetarySystem=
    new THREE.Group();

scene.add(
    planetarySystem
);


const planet=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .48,
            32,
            32
        ),

        new THREE.MeshBasicMaterial({
            color:0x777777
        })

    );

planet.position.set(
    4,
    .8,
    -1
);

planetarySystem.add(
    planet
);


/* ============================================================
   COMETS
============================================================ */

const COMETS=120;

const cometPositions=
    new Float32Array(
        COMETS*3
    );

for(
    let i=0;
    i<COMETS;
    i++
){

    const p=i*3;

    cometPositions[p]=
        (Math.random()-.5)*35;

    cometPositions[p+1]=
        (Math.random()-.5)*18;

    cometPositions[p+2]=
        (Math.random()-.5)*35;
}


const cometGeometry=
    new THREE.BufferGeometry();

cometGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        cometPositions,
        3
    )
);


const cometMaterial=
    new THREE.PointsMaterial({

        color:0xffffff,

        size:.065,

        transparent:true,

        opacity:.85,

        blending:
            THREE.AdditiveBlending
    });


const comets=
    new THREE.Points(
        cometGeometry,
        cometMaterial
    );

scene.add(comets);


/* ============================================================
   HAND TRACKING
============================================================ */

let hands=null;

async function startCamera(){

    try{

        const video=
            document.getElementById(
                "camera"
            );

        const stream=
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    width:{
                        ideal:320
                    },

                    height:{
                        ideal:240
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    },

                    facingMode:"user"
                },

                audio:false
            });

        video.srcObject=
            stream;

        video.style.display=
            "block";

        await video.play();

        initializeHands(
            video
        );

        document.getElementById(
            "gesture"
        ).textContent=
            "CAMERA • LOCAL HAND CONTROL";

    }catch(error){

        console.warn(
            "Camera unavailable",
            error
        );

        document.getElementById(
            "gesture"
        ).textContent=
            "MOUSE / TOUCH • LOCAL CONTROL";
    }
}


function initializeHands(video){

    hands=
        new Hands({

            locateFile:
                file=>
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/"
                    +file

        });


    hands.setOptions({

        maxNumHands:2,

        modelComplexity:0,

        minDetectionConfidence:.45,

        minTrackingConfidence:.45
    });


    hands.onResults(
        processHands
    );


    let busy=false;

    let lastProcess=0;


    async function loop(){

        const now=
            performance.now();


        if(

            !busy &&

            video.readyState>=2 &&

            now-lastProcess>32

        ){

            busy=true;

            lastProcess=now;

            try{

                await hands.send({
                    image:video
                });

            }catch(e){

                console.warn(e);
            }

            busy=false;
        }

        requestAnimationFrame(
            loop
        );
    }

    loop();
}


/* ============================================================
   HAND PROCESSING
============================================================ */

function distance(a,b){

    const x=
        a.x-b.x;

    const y=
        a.y-b.y;

    return Math.sqrt(
        x*x+
        y*y
    );
}


function processHands(results){

    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0
    ){

        handDetected=false;

        return;
    }


    handDetected=true;


    const h=
        results.multiHandLandmarks[0];


    const px=
        (
            h[0].x+
            h[5].x+
            h[9].x+
            h[13].x+
            h[17].x
        )/5;


    const py=
        (
            h[0].y+
            h[5].y+
            h[9].y+
            h[13].y+
            h[17].y
        )/5;


    targetHandX=
        (.5-px)*7;


    targetHandY=
        (.5-py)*5;


    /* openness */

    const palm=
        distance(
            h[0],
            h[9]
        );


    const tips=[
        h[8],
        h[12],
        h[16],
        h[20]
    ];


    let open=0;


    for(
        let i=0;
        i<tips.length;
        i++
    ){

        open+=
            distance(
                tips[i],
                h[0]
            )/
            palm;
    }


    open/=4;


    openness=
        THREE.MathUtils.clamp(
            (open-1.2)/1.2,
            0,
            1
        );


    /* pinch */

    pinch=
        1-
        THREE.MathUtils.clamp(
            distance(
                h[4],
                h[8]
            )/.16,
            0,
            1
        );


    /* velocity */

    const now=
        performance.now();


    const dt=
        Math.max(
            .001,
            (now-
            previousTime)/1000
        );


    const vx=
        (px-
        previousX)/dt;


    const vy=
        (py-
        previousY)/dt;


    velocity=
        THREE.MathUtils.lerp(

            velocity,

            Math.min(
                Math.sqrt(
                    vx*vx+
                    vy*vy
                ),
                8
            ),

            .35
        );


    previousX=px;
    previousY=py;
    previousTime=now;


    /* swipe */

    if(

        Math.abs(vx)>2.7 &&

        now>swipeLock

    ){

        changeUniverse(
            vx>0?1:-1
        );

        swipeLock=
            now+700;
    }


    /* two hands */

    if(
        results.multiHandLandmarks.length>=2
    ){

        const h2=
            results.multiHandLandmarks[1];


        const x2=
            (
                h2[0].x+
                h2[5].x+
                h2[9].x+
                h2[13].x+
                h2[17].x
            )/5;


        const y2=
            (
                h2[0].y+
                h2[5].y+
                h2[9].y+
                h2[13].y+
                h2[17].y
            )/5;


        power=
            THREE.MathUtils.clamp(

                Math.sqrt(
                    Math.pow(
                        px-x2,
                        2
                    )+
                    Math.pow(
                        py-y2,
                        2
                    )
                )*4,

                0,
                1
            );

    }else{

        power=.2;
    }


    document.getElementById(
        "gesture"
    ).textContent=
        "HAND ACTIVE • COSMIC CONTROL";
}


/* ============================================================
   MOUSE
============================================================ */

window.addEventListener(
    "pointermove",
    e=>{

        if(handDetected)
            return;

        targetHandX=
            (
                e.clientX/
                innerWidth-
                .5
            )*7;

        targetHandY=
            -(
                e.clientY/
                innerHeight-
                .5
            )*5;
    }
);


window.addEventListener(
    "pointerdown",
    ()=>{

        if(handDetected)
            return;

        uniforms.uShock.value=
            1.6;

        power=1;
    }
);


window.addEventListener(
    "pointerup",
    ()=>{

        if(!handDetected)
            power=.2;
    }
);


/* ============================================================
   CHANGE UNIVERSE
============================================================ */

function changeUniverse(
    direction=1
){

    universe+=direction;


    if(universe<0)
        universe=
            universes.length-1;


    if(
        universe>=
        universes.length
    )
        universe=0;


    uniforms.uMode.value=
        universe;


    document.getElementById(
        "environment"
    ).textContent=
        "UNIVERSE: "+
        universes[universe];


    uniforms.uShock.value=
        1.7;
}


/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowRight"
        )
            changeUniverse(1);


        if(
            e.key==="ArrowLeft"
        )
            changeUniverse(-1);


        if(
            e.key===" "
        )
            uniforms.uShock.value=
                1.7;


        const n=
            parseInt(e.key);


        if(
            n>=1 &&
            n<=9
        ){

            universe=
                n-1;

            uniforms.uMode.value=
                universe;

            document.getElementById(
                "environment"
            ).textContent=
                "UNIVERSE: "+
                universes[universe];
        }
    }
);


/* ============================================================
   ANIMATION
============================================================ */

const clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const time=
        clock.getElapsedTime();


    uniforms.uTime.value=
        time;


    /* ultra-low-latency hand movement */

    handX+=
        (
            targetHandX-
            handX
        )*.40;


    handY+=
        (
            targetHandY-
            handY
        )*.40;


    uniforms.uHand.value.set(
        handX,
        handY,
        0
    );


    /* expansion */

    let expansion;


    if(handDetected){

        expansion=
            openness*.95-
            (1-openness)*.55;

    }else{

        expansion=.25;
    }


    uniforms.uExpansion.value=
        THREE.MathUtils.lerp(

            uniforms.uExpansion.value,

            expansion,

            .2
        );


    /* gravity */

    uniforms.uGravity.value=
        THREE.MathUtils.lerp(

            uniforms.uGravity.value,

            pinch*3.2,

            .25
        );


    /* energy */

    const motion=
        Math.min(
            1,
            velocity*.15
        );


    uniforms.uPower.value=
        THREE.MathUtils.lerp(

            uniforms.uPower.value,

            .2+
            motion+
            power*.7,

            .16
        );


    /* shock */

    uniforms.uShock.value*=
        .91;


    /* color */

    uniforms.uHue.value=
        .55+
        Math.sin(
            time*.08
        )*.3+
        motion*.25;


    /* particle rotation */

    particles.rotation.y=
        time*.035;

    particles.rotation.x=
        Math.sin(
            time*.12
        )*.12;


    /* stars */

    stars.rotation.y=
        time*.004;

    stars.rotation.x=
        time*.001;


    /* comets */

    comets.rotation.y=
        -time*.012;


    /* planetary system */

    planetarySystem.rotation.y=
        time*.15;

    planet.rotation.y=
        time*.8;


    /* rings */

    for(
        let i=0;
        i<rings.length;
        i++
    ){

        const ring=
            rings[i];


        ring.rotation.z=
            time*
            (
                .08+
                i*.025
            );


        ring.rotation.x=
            Math.PI/2+
            Math.sin(
                time*.15+i
            )*.08;


        ring.scale.setScalar(

            1+
            power*.4+
            Math.sin(
                time*1.8+i
            )*.025

        );


        ring.material.opacity=
            .012+
            uniforms.uPower.value*
            .02;
    }


    /* cinematic camera */

    camera.position.x=
        Math.sin(
            time*.12
        )*.25;


    camera.position.y=
        Math.cos(
            time*.16
        )*.15;


    camera.position.z=
        10-
        power*.8;


    camera.lookAt(
        0,
        0,
        0
    );


    renderer.render(
        scene,
        camera
    );
}


/* ============================================================
   START EXPERIENCE
============================================================ */

document.getElementById(
    "start"
).addEventListener(
    "click",
    async()=>{

        document.getElementById(
            "start"
        ).style.display=
            "none";


        document.getElementById(
            "loading"
        ).textContent=
            "INITIALIZING TAJAMAL COSMIC ENGINE...";


        animate();


        await startCamera();


        document.getElementById(
            "loading"
        ).textContent="";
    }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
