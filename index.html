<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Neural Particle Universe</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    position:fixed;
    inset:0;
}

#camera{
    position:fixed;
    right:18px;
    bottom:18px;
    width:190px;
    height:140px;
    object-fit:cover;
    border-radius:16px;
    opacity:.55;
    transform:scaleX(-1);
    border:1px solid rgba(255,255,255,.15);
    z-index:10;
    display:none;
}

#hud{
    position:fixed;
    left:18px;
    top:18px;
    z-index:20;
    color:white;
    pointer-events:none;
}

.title{
    font-size:20px;
    font-weight:800;
    letter-spacing:3px;
    text-shadow:0 0 20px rgba(255,255,255,.5);
}

.status{
    margin-top:8px;
    font-size:12px;
    letter-spacing:1px;
    opacity:.75;
}

#shape{
    margin-top:8px;
    font-size:13px;
    opacity:.9;
}

#hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:rgba(255,255,255,.65);
    font-size:11px;
    letter-spacing:1px;
    text-align:center;
    pointer-events:none;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:30;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.55);
    color:white;
    padding:16px 26px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
    cursor:pointer;
    backdrop-filter:blur(10px);
}

#start:hover{
    background:rgba(255,255,255,.12);
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="hud">
    <div class="title">NEURAL PARTICLE UNIVERSE</div>
    <div class="status" id="status">INITIALIZING...</div>
    <div id="shape">FORM: HEART</div>
</div>

<div id="hint">
OPEN PALM = EXPAND · FIST = COLLAPSE · PINCH = GRAVITY · SWIPE = CHANGE FORM · TWO HANDS = POWER
</div>

<button id="start">START EXPERIENCE</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PARTICLES = 120000;

const canvas = document.createElement("canvas");

const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,1);

document.body.appendChild(canvas);


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
    55,
    innerWidth / innerHeight,
    .1,
    100
);

camera3D.position.z = 8;


/* =========================================================
   PARTICLE DATA
========================================================= */

const positions = new Float32Array(PARTICLES * 3);
const seeds     = new Float32Array(PARTICLES);
const sizes     = new Float32Array(PARTICLES);
const randoms   = new Float32Array(PARTICLES);

for(let i=0;i<PARTICLES;i++){

    const i3=i*3;

    positions[i3]   = (Math.random()-.5)*2;
    positions[i3+1] = (Math.random()-.5)*2;
    positions[i3+2] = (Math.random()-.5)*2;

    seeds[i]=Math.random()*1000;

    sizes[i]=0.5+Math.random()*1.8;

    randoms[i]=Math.random();
}

const geometry = new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions,3)
);

geometry.setAttribute(
    "aSeed",
    new THREE.BufferAttribute(seeds,1)
);

geometry.setAttribute(
    "aSize",
    new THREE.BufferAttribute(sizes,1)
);

geometry.setAttribute(
    "aRandom",
    new THREE.BufferAttribute(randoms,1)
);


/* =========================================================
   GPU PARTICLE SHADER
========================================================= */

const vertexShader = `

uniform float uTime;
uniform float uExpansion;
uniform float uForm;
uniform vec3 uHand;
uniform float uHandPower;
uniform float uShock;
uniform float uEnergy;

attribute float aSeed;
attribute float aSize;
attribute float aRandom;

varying float vEnergy;

#define PI 3.14159265359

vec3 heart(float t){

    float x = 16.0 * pow(sin(t),3.0);

    float y =
        13.0*cos(t)
        -5.0*cos(2.0*t)
        -2.0*cos(3.0*t)
        -cos(4.0*t);

    return vec3(x,y,0.0)*0.075;
}

vec3 flower(float t,float r){

    float petals=7.0;

    float radius =
        1.5 +
        .8*sin(t*petals);

    return vec3(
        cos(t)*radius,
        sin(t)*radius,
        sin(t*3.0+r*4.0)*.5
    );
}

vec3 galaxy(float t,float r){

    float radius=.3+r*3.4;

    float angle=t+radius*1.8;

    return vec3(
        cos(angle)*radius,
        sin(angle)*radius*.45,
        sin(angle*2.0+r*8.0)*.35
    );
}

vec3 vortex(float t,float r){

    float radius=.15+r*3.2;

    float angle=t+radius*3.5;

    return vec3(
        cos(angle)*radius,
        sin(angle)*radius,
        (r-.5)*3.5
    );
}

vec3 sphere(float t,float r){

    float z=1.0-2.0*r;

    float rr=sqrt(max(0.0,1.0-z*z));

    float a=t;

    return vec3(
        rr*cos(a),
        rr*sin(a),
        z
    )*2.0;
}

vec3 torus(float t,float r){

    float R=1.7;
    float tube=.55;

    return vec3(
        (R+tube*cos(r*PI*2.0))*cos(t),
        (R+tube*cos(r*PI*2.0))*sin(t),
        tube*sin(r*PI*2.0)
    );
}

vec3 dna(float t,float r){

    float y=(r-.5)*5.0;

    float angle=y*3.0+t;

    return vec3(
        cos(angle)*1.3,
        y,
        sin(angle)*1.3
    );
}

vec3 saturn(float t,float r){

    float ring=r<.65 ? 1.0 : .0;

    if(ring>0.5){

        float rr=1.3+r*.9;

        return vec3(
            cos(t)*rr,
            sin(t)*rr*.35,
            sin(t*5.0+r*20.0)*.04
        );
    }

    return sphere(t,r)*.8;
}

vec3 firework(float t,float r){

    float theta=acos(1.0-2.0*r);
    float phi=t;

    float radius=r*3.0;

    return vec3(
        sin(theta)*cos(phi),
        sin(theta)*sin(phi),
        cos(theta)
    )*radius;
}

void main(){

    float t=aSeed+uTime*.25;

    float r=aRandom;

    vec3 p;

    if(uForm<.5){

        p=heart(t);
        p*=1.25;

    }else if(uForm<1.5){

        p=flower(t,r);

    }else if(uForm<2.5){

        p=galaxy(t,r);

    }else if(uForm<3.5){

        p=vortex(t,r);

    }else if(uForm<4.5){

        p=sphere(t,r);

    }else if(uForm<5.5){

        p=torus(t,r);

    }else if(uForm<6.5){

        p=dna(t,r);

    }else if(uForm<7.5){

        p=saturn(t,r);

    }else{

        p=firework(t,r);

    }

    /* organic motion */

    p.x += sin(t*1.7+p.z*3.0)*.08;
    p.y += cos(t*1.3+p.x*2.0)*.08;
    p.z += sin(t*1.1+p.y*2.0)*.08;

    /* expansion */

    float scale=1.0+uExpansion*1.8;

    p*=scale;

    /* hand attraction / repulsion */

    vec3 delta=p-uHand;

    float dist=length(delta)+.001;

    float force=exp(-dist*1.5)*uHandPower;

    p += normalize(delta)*force;

    /* shockwave */

    float wave=sin(dist*9.0-uTime*9.0)*uShock;

    p += normalize(delta)*wave;

    /* energy */

    p*=1.0+uEnergy*.15;

    vec4 mvPosition=modelViewMatrix*vec4(p,1.0);

    float perspective=7.0/(-mvPosition.z);

    gl_PointSize=
        aSize*
        perspective*
        (1.0+uEnergy*2.0);

    gl_Position=projectionMatrix*mvPosition;

    vEnergy=uEnergy;
}
`;

const fragmentShader = `

uniform float uTime;
uniform float uHue;

varying float vEnergy;

vec3 hsv2rgb(vec3 c){

    vec4 K=vec4(
        1.0,
        2.0/3.0,
        1.0/3.0,
        3.0
    );

    vec3 p=
        abs(fract(c.xxx+K.xyz)*6.0-K.www);

    return c.z*
        mix(
            K.xxx,
            clamp(p-K.xxx,0.0,1.0),
            c.y
        );
}

void main(){

    vec2 uv=gl_PointCoord-.5;

    float d=length(uv);

    if(d>.5) discard;

    float glow=smoothstep(.5,0.0,d);

    float hue=
        fract(
            uHue+
            vEnergy*.15+
            d*.1
        );

    vec3 color=hsv2rgb(
        vec3(
            hue,
            .8,
            1.0
        )
    );

    color*=glow*(1.0+vEnergy*2.0);

    gl_FragColor=
        vec4(
            color,
            glow
        );
}
`;

const uniforms={

    uTime:{value:0},

    uExpansion:{value:.25},

    uForm:{value:0},

    uHand:{
        value:new THREE.Vector3()
    },

    uHandPower:{value:0},

    uShock:{value:0},

    uEnergy:{value:.2},

    uHue:{value:.58}
};

const material=new THREE.ShaderMaterial({

    uniforms:uniforms,

    vertexShader,
    fragmentShader,

    transparent:true,

    depthWrite:false,

    blending:THREE.AdditiveBlending
});

const particles=new THREE.Points(
    geometry,
    material
);

scene.add(particles);


/* =========================================================
   STAR FIELD
========================================================= */

const starCount=7000;

const starPositions=new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){

    const i3=i*3;

    const radius=15+Math.random()*35;

    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);

    starPositions[i3]=
        radius*Math.sin(phi)*Math.cos(theta);

    starPositions[i3+1]=
        radius*Math.sin(phi)*Math.sin(theta);

    starPositions[i3+2]=
        radius*Math.cos(phi);
}

const starGeo=new THREE.BufferGeometry();

starGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(starPositions,3)
);

const starMat=new THREE.PointsMaterial({

    color:0xffffff,

    size:.025,

    transparent:true,

    opacity:.65,

    depthWrite:false
});

const stars=new THREE.Points(
    starGeo,
    starMat
);

scene.add(stars);


/* =========================================================
   ENERGY RINGS
========================================================= */

const rings=[];

for(let i=0;i<5;i++){

    const geo=new THREE.RingGeometry(
        1+i*.45,
        1.01+i*.45,
        96
    );

    const mat=new THREE.MeshBasicMaterial({

        color:0xffffff,

        transparent:true,

        opacity:0,

        side:THREE.DoubleSide,

        blending:THREE.AdditiveBlending
    });

    const ring=new THREE.Mesh(geo,mat);

    ring.rotation.x=Math.PI/2;

    scene.add(ring);

    rings.push(ring);
}


/* =========================================================
   HAND STATE
========================================================= */

let handDetected=false;

let handX=0;
let handY=0;

let targetHandX=0;
let targetHandY=0;

let handVelocity=0;

let openness=.5;
let pinch=.0;
let power=.2;

let lastPalmX=0;
let lastPalmY=0;
let lastHandTime=performance.now();

let swipeCooldown=0;


/* =========================================================
   FORMS
========================================================= */

const forms=[
    "HEART",
    "FLOWER",
    "GALAXY",
    "VORTEX",
    "SPHERE",
    "TORUS",
    "DNA",
    "SATURN",
    "FIREWORK"
];

let formIndex=0;

function changeForm(direction=1){

    formIndex+=direction;

    if(formIndex<0)
        formIndex=forms.length-1;

    if(formIndex>=forms.length)
        formIndex=0;

    uniforms.uForm.value=formIndex;

    document.getElementById("shape").textContent=
        "FORM: "+forms[formIndex];
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const video=document.getElementById("camera");

let hands=null;

async function startHands(){

    try{

        hands=new Hands({
            locateFile:(file)=>{

                return "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/"+file;

            }
        });

        hands.setOptions({

            maxNumHands:2,

            modelComplexity:0,

            minDetectionConfidence:.45,

            minTrackingConfidence:.45

        });

        hands.onResults(processHands);

        const stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    width:{
                        ideal:320
                    },

                    height:{
                        ideal:240
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    },

                    facingMode:"user"
                },

                audio:false
            });

        video.srcObject=stream;

        video.style.display="block";

        await video.play();

        document.getElementById("status").textContent=
            "CAMERA ACTIVE · LOCAL GPU MODE";

        cameraLoop();

    }catch(error){

        console.error(error);

        document.getElementById("status").textContent=
            "MOUSE MODE · CAMERA UNAVAILABLE";

    }
}


/* =========================================================
   FAST CAMERA LOOP
========================================================= */

let cameraBusy=false;

let lastCameraProcess=0;

async function cameraLoop(){

    const now=performance.now();

    /*
       Important:

       We deliberately don't process every rendered frame.

       Rendering can run at 60/120 FPS while
       AI tracking runs around 24-30 FPS.
    */

    if(
        !cameraBusy &&
        video.readyState>=2 &&
        now-lastCameraProcess>35
    ){

        cameraBusy=true;

        lastCameraProcess=now;

        try{

            await hands.send({
                image:video
            });

        }catch(e){

            console.warn("Hand tracking:",e);

        }

        cameraBusy=false;
    }

    requestAnimationFrame(cameraLoop);
}


/* =========================================================
   HAND PROCESSING
========================================================= */

function distance(a,b){

    const dx=a.x-b.x;
    const dy=a.y-b.y;

    return Math.sqrt(dx*dx+dy*dy);
}

function processHands(results){

    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0
    ){

        handDetected=false;

        return;
    }

    handDetected=true;

    const h=results.multiHandLandmarks[0];

    /*
       Palm center
    */

    const palmX=
        (h[0].x+h[5].x+h[9].x+h[13].x+h[17].x)/5;

    const palmY=
        (h[0].y+h[5].y+h[9].y+h[13].y+h[17].y)/5;

    /*
       Convert webcam coordinates
       into particle-space coordinates.
    */

    targetHandX=(.5-palmX)*6.0;

    targetHandY=(.5-palmY)*-4.0;

    /*
       Finger openness
    */

    const palmSize=distance(h[0],h[9]);

    const tips=[
        h[8],
        h[12],
        h[16],
        h[20]
    ];

    const joints=[
        h[6],
        h[10],
        h[14],
        h[18]
    ];

    let openAmount=0;

    for(let i=0;i<4;i++){

        openAmount+=
            distance(tips[i],h[0]) /
            palmSize;
    }

    openAmount/=4;

    openness=
        THREE.MathUtils.clamp(
            (openAmount-1.3)/1.2,
            0,
            1
        );

    /*
       Pinch
    */

    const pinchDistance=
        distance(h[4],h[8]);

    pinch=
        1-
        THREE.MathUtils.clamp(
            pinchDistance/.16,
            0,
            1
        );

    /*
       Velocity
    */

    const now=performance.now();

    const dt=Math.max(
        .001,
        (now-lastHandTime)/1000
    );

    const vx=(palmX-lastPalmX)/dt;
    const vy=(palmY-lastPalmY)/dt;

    const velocity=Math.sqrt(
        vx*vx+vy*vy
    );

    handVelocity=
        THREE.MathUtils.lerp(
            handVelocity,
            Math.min(velocity,8),
            .35
        );

    lastPalmX=palmX;
    lastPalmY=palmY;
    lastHandTime=now;

    /*
       Swipe detection
    */

    if(
        Math.abs(vx)>2.8 &&
        now>swipeCooldown
    ){

        changeForm(vx>0?1:-1);

        swipeCooldown=now+650;
    }

    /*
       Two hands = power mode
    */

    if(results.multiHandLandmarks.length>=2){

        const h2=results.multiHandLandmarks[1];

        const x2=
            (h2[0].x+h2[5].x+h2[9].x+
             h2[13].x+h2[17].x)/5;

        const y2=
            (h2[0].y+h2[5].y+h2[9].y+
             h2[13].y+h2[17].y)/5;

        const twoHandDistance=
            Math.sqrt(
                Math.pow(palmX-x2,2)+
                Math.pow(palmY-y2,2)
            );

        power=
            THREE.MathUtils.clamp(
                twoHandDistance*4,
                0,
                1
            );

    }else{

        power=.2;
    }
}


/* =========================================================
   MOUSE FALLBACK
========================================================= */

let mouseActive=false;

window.addEventListener("pointermove",(e)=>{

    mouseActive=true;

    targetHandX=
        (e.clientX/innerWidth-.5)*6;

    targetHandY=
        -(e.clientY/innerHeight-.5)*4;

});

window.addEventListener("pointerdown",()=>{

    if(!handDetected){

        power=1;

        uniforms.uShock.value=1;
    }

});

window.addEventListener("pointerup",()=>{

    power=.2;

});


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",(e)=>{

    if(e.key==="ArrowRight")
        changeForm(1);

    if(e.key==="ArrowLeft")
        changeForm(-1);

    if(e.key===" ")
        uniforms.uShock.value=1;

    if(e.key==="1") formIndex=0;
    if(e.key==="2") formIndex=1;
    if(e.key==="3") formIndex=2;
    if(e.key==="4") formIndex=3;
    if(e.key==="5") formIndex=4;
    if(e.key==="6") formIndex=5;
    if(e.key==="7") formIndex=6;
    if(e.key==="8") formIndex=7;
    if(e.key==="9") formIndex=8;

    uniforms.uForm.value=formIndex;

    document.getElementById("shape").textContent=
        "FORM: "+forms[formIndex];
});


/* =========================================================
   ANIMATION
========================================================= */

const clock=new THREE.Clock();

let frame=0;

function animate(){

    requestAnimationFrame(animate);

    const t=clock.getElapsedTime();

    uniforms.uTime.value=t;

    /*
       VERY FAST RESPONSE:

       Instead of instantly snapping to camera position,
       we use extremely small smoothing.
    */

    handX+=
        (targetHandX-handX)*.32;

    handY+=
        (targetHandY-handY)*.32;

    uniforms.uHand.value.set(
        handX,
        handY,
        0
    );

    /*
       Hand behavior
    */

    let expansion;

    if(handDetected){

        /*
           Open hand:
           huge expansion

           Closed fist:
           collapse
        */

        expansion=
            openness*.95-
            (1-openness)*.55;

    }else{

        expansion=.25;
    }

    uniforms.uExpansion.value=
        THREE.MathUtils.lerp(
            uniforms.uExpansion.value,
            expansion,
            .15
        );

    /*
       Pinch = strong local gravity
    */

    uniforms.uHandPower.value=
        THREE.MathUtils.lerp(
            uniforms.uHandPower.value,
            pinch*2.8,
            .2
        );

    /*
       Hand movement creates energy
    */

    const movementEnergy=
        Math.min(
            1,
            handVelocity*.16
        );

    const targetEnergy=
        .18+
        movementEnergy+
        power*.55;

    uniforms.uEnergy.value=
        THREE.MathUtils.lerp(
            uniforms.uEnergy.value,
            targetEnergy,
            .12
        );

    /*
       Shockwave decays automatically
    */

    uniforms.uShock.value*=.91;

    /*
       Color movement
    */

    uniforms.uHue.value=
        .55+
        Math.sin(t*.12)*.25+
        movementEnergy*.25;

    /*
       Slow cinematic universe rotation.

       This is GPU-cheap because the whole particle
       object rotates instead of changing every particle.
    */

    particles.rotation.y=t*.045;

    particles.rotation.x=
        Math.sin(t*.17)*.12;

    stars.rotation.y=t*.006;

    /*
       Energy rings
    */

    for(let i=0;i<rings.length;i++){

        const ring=rings[i];

        ring.rotation.z=
            t*(.2+i*.08);

        ring.scale.setScalar(
            1+
            power*.4+
            Math.sin(t*2+i)*.05
        );

        ring.material.opacity=
            .015+
            uniforms.uEnergy.value*.025;
    }

    /*
       Camera breathing
    */

    camera3D.position.x=
        Math.sin(t*.15)*.12;

    camera3D.position.y=
        Math.cos(t*.18)*.08;

    camera3D.lookAt(0,0,0);

    renderer.render(
        scene,
        camera3D
    );

    /*
       Lightweight status update.

       NOT every frame.
    */

    frame++;

    if(frame%20===0){

        document.getElementById("status").textContent=
            handDetected
            ? "HAND TRACKING · GPU PARTICLES"
            : "MOUSE MODE · GPU PARTICLES";
    }
}


/* =========================================================
   START
========================================================= */

document.getElementById("start").addEventListener(
    "click",
    async ()=>{

        document.getElementById("start").style.display="none";

        animate();

        await startHands();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

    camera3D.aspect=
        innerWidth/innerHeight;

    camera3D.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});


</script>

</body>
</html>
